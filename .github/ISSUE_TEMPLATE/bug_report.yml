name: Bug report
description: Report a broken skill, script or doc
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      placeholder: "npm run eval on Node 22"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Node version and OS
      placeholder: "v22.14.0, Ubuntu 24.04"
    validations:
      required: false
