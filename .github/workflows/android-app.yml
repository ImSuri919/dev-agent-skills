name: Android app

on:
  push:
    tags: ['android-app-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build signed debug-key APK
        working-directory: android
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -n "$SDK"
          echo "sdk.dir=$SDK" > local.properties
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          /tmp/gradle-dist/gradle-8.7/bin/gradle :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/dev-agent-skills-1.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dev-agent-skills-apk
          path: android/app/build/outputs/apk/release/dev-agent-skills-1.0.apk
          if-no-files-found: error

      - name: Publish APK release
        if: startsWith(github.ref, 'refs/tags/android-app-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            android/app/build/outputs/apk/release/dev-agent-skills-1.0.apk \
            --title "Dev Agent Skills Android app v1.0" \
            --notes "Installable Android app for the dev-agent-skills playground: 16 skills, MCP, evals and the Android pack. Built from commit ${GITHUB_SHA:0:7}." \
            --target "$GITHUB_SHA"
