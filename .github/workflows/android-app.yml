name: Android app

on:
  push:
    tags: ['android-app-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build signed debug-key APK
        working-directory: android
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK="${SDK:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          echo "sdk.dir=$SDK" > local.properties
          SDKMANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"
          export ANDROID_KEYSTORE="$RUNNER_TEMP/dev-agent-skills-debug.keystore"
          keytool -genkeypair -v \
            -keystore "$ANDROID_KEYSTORE" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" >/dev/null
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          /tmp/gradle-dist/gradle-8.7/bin/gradle :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/dev-agent-skills-1.0.apk
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/dev-agent-skills-1.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dev-agent-skills-apk
          path: android/app/build/outputs/apk/release/dev-agent-skills-1.0.apk
          if-no-files-found: error

      - name: Publish APK release
        if: startsWith(github.ref, 'refs/tags/android-app-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          APK="android/app/build/outputs/apk/release/dev-agent-skills-1.0.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Dev Agent Skills Android app v1.0" \
              --notes "Installable Android app for the dev-agent-skills playground: 16 skills, MCP, evals and the Android pack. Built from commit ${GITHUB_SHA:0:7}." \
              --target "$GITHUB_SHA"
          fi
